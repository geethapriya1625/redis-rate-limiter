services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # two app instances sharing one Redis: limits hold across both
  app1:
    build: .
    environment: { REDIS_HOST: redis }
    ports: ["8081:8080"]
    depends_on: [redis]
  app2:
    build: .
    environment: { REDIS_HOST: redis }
    ports: ["8082:8080"]
    depends_on: [redis]
